<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1900" viewBox="0 0 2240 1900">
<rect width="2240" height="1900" fill="#ffffff"/>

<!-- ============================ Kanten (zuerst, damit Kaesten oben liegen) -->
<g stroke="#000000" stroke-width="3" fill="none">
  <!-- Vererbung: Person -> Mitglied / Trainer -->
  <line x1="1280" y1="380" x2="1280" y2="450"/>
  <line x1="1000" y1="450" x2="1900" y2="450"/>
  <line x1="1000" y1="450" x2="1000" y2="560"/>
  <line x1="1900" y1="450" x2="1900" y2="560"/>
  <!-- Assoziation Schliessfach - Mitglied -->
  <line x1="500" y1="676" x2="720" y2="676"/>
  <!-- Assoziation Mitglied - Kurs -->
  <line x1="1100" y1="838" x2="1100" y2="1080"/>
  <!-- Assoziation Trainer - Kurs -->
  <line x1="1900" y1="838" x2="1900" y2="1260"/>
  <line x1="1900" y1="1260" x2="1560" y2="1260"/>
  <!-- Komposition Fitnessstudio - Kurs -->
  <line x1="1280" y1="1560" x2="1280" y2="1404"/>
  <!-- Aggregation Fitnessstudio - Mitglied -->
  <line x1="1000" y1="1690" x2="820" y2="1690"/>
  <line x1="820" y1="1690" x2="820" y2="838"/>
</g>

<!-- Vererbungsdreieck an der Oberklasse Person -->
<polygon points="1280,338 1257,380 1303,380" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<!-- Komposition: schwarze Raute am Ganzen (Fitnessstudio) -->
<polygon points="1280,1560 1293,1537 1280,1514 1267,1537" fill="#000000" stroke="#000000" stroke-width="3"/>
<!-- Aggregation: weisse Raute am Ganzen (Fitnessstudio) -->
<polygon points="1000,1690 977,1677 954,1690 977,1703" fill="#ffffff" stroke="#000000" stroke-width="3"/>

<!-- ==================================================== Klasse Person -->
<g stroke="#000000" stroke-width="3" fill="#ffffff">
  <rect x="1000" y="60" width="560" height="278"/>
</g>
<g stroke="#000000" stroke-width="3">
  <line x1="1000" y1="120" x2="1560" y2="120"/>
  <line x1="1000" y1="252" x2="1560" y2="252"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000000">
  <text x="1280" y="102" text-anchor="middle" font-weight="bold">Person</text>
  <text x="1020" y="175">name</text>
  <text x="1020" y="221">geburtsdatum</text>
  <text x="1020" y="307">kontaktdatenÄndern()</text>
</g>

<!-- =============================================== Klasse Schließfach -->
<g stroke="#000000" stroke-width="3" fill="#ffffff">
  <rect x="60" y="560" width="440" height="232"/>
</g>
<g stroke="#000000" stroke-width="3">
  <line x1="60" y1="620" x2="500" y2="620"/>
  <line x1="60" y1="706" x2="500" y2="706"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000000">
  <text x="280" y="602" text-anchor="middle" font-weight="bold">Schließfach</text>
  <text x="80" y="675">fachnummer</text>
  <text x="80" y="761">öffnen()</text>
</g>

<!-- ================================================== Klasse Mitglied -->
<g stroke="#000000" stroke-width="3" fill="#ffffff">
  <rect x="720" y="560" width="560" height="278"/>
</g>
<g stroke="#000000" stroke-width="3">
  <line x1="720" y1="620" x2="1280" y2="620"/>
  <line x1="720" y1="752" x2="1280" y2="752"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000000">
  <text x="1000" y="602" text-anchor="middle" font-weight="bold">Mitglied</text>
  <text x="740" y="675">mitgliedsnummer</text>
  <text x="740" y="721">beitrag</text>
  <text x="740" y="807">kursBuchen()</text>
</g>

<!-- =================================================== Klasse Trainer -->
<g stroke="#000000" stroke-width="3" fill="#ffffff">
  <rect x="1620" y="560" width="560" height="278"/>
</g>
<g stroke="#000000" stroke-width="3">
  <line x1="1620" y1="620" x2="2180" y2="620"/>
  <line x1="1620" y1="752" x2="2180" y2="752"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000000">
  <text x="1900" y="602" text-anchor="middle" font-weight="bold">Trainer</text>
  <text x="1640" y="675">personalnummer</text>
  <text x="1640" y="721">qualifikation</text>
  <text x="1640" y="807">kursLeiten()</text>
</g>

<!-- ====================================================== Klasse Kurs -->
<g stroke="#000000" stroke-width="3" fill="#ffffff">
  <rect x="1000" y="1080" width="560" height="324"/>
</g>
<g stroke="#000000" stroke-width="3">
  <line x1="1000" y1="1140" x2="1560" y2="1140"/>
  <line x1="1000" y1="1318" x2="1560" y2="1318"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000000">
  <text x="1280" y="1122" text-anchor="middle" font-weight="bold">Kurs</text>
  <text x="1020" y="1195">kursnummer</text>
  <text x="1020" y="1241">titel</text>
  <text x="1020" y="1287">wochentag</text>
  <text x="1020" y="1373">teilnehmerlisteDrucken()</text>
</g>

<!-- ============================================= Klasse Fitnessstudio -->
<g stroke="#000000" stroke-width="3" fill="#ffffff">
  <rect x="1000" y="1560" width="560" height="278"/>
</g>
<g stroke="#000000" stroke-width="3">
  <line x1="1000" y1="1620" x2="1560" y2="1620"/>
  <line x1="1000" y1="1752" x2="1560" y2="1752"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000000">
  <text x="1280" y="1602" text-anchor="middle" font-weight="bold">Fitnessstudio</text>
  <text x="1020" y="1675">name</text>
  <text x="1020" y="1721">adresse</text>
  <text x="1020" y="1807">kursAnlegen()</text>
</g>

<!-- ======================================================= Kardinalitäten -->
<g font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#000000">
  <text x="512" y="668">0..1</text>
  <text x="686" y="668">1</text>
  <text x="1114" y="884">0..*</text>
  <text x="1114" y="1052">0..*</text>
  <text x="1914" y="884">1</text>
  <text x="1580" y="1246">1..*</text>
</g>
</svg>
